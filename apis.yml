aid: airweave
name: Airweave
description: >-
  Airweave is an open-source (MIT) context-retrieval layer that lets AI agents and RAG
  pipelines search across 50+ connected apps and databases through a single API. It syncs
  data from sources like Slack, Notion, GitHub, Google Drive, and Postgres, then exposes
  instant (sub-second vector), classic (LLM-planned), and agentic (multi-step) search over
  unified collections. Query it via the REST API, official Python and TypeScript SDKs, a
  CLI, an embeddable Connect UI widget, or a hosted Model Context Protocol (MCP) server,
  with real-time Svix-backed webhooks for sync and source-connection lifecycle events.
